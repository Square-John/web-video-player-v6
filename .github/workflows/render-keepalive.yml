name: Keep Render Demo Backend Warm

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  health-check:
    if: github.event_name == 'workflow_dispatch' || vars.KEEP_BACKEND_WARM == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
    steps:
      - name: Check Render health endpoint
        shell: bash
        run: |
          if [ -z "$BACKEND_ORIGIN" ]; then
            echo "Repository Variable BACKEND_ORIGIN is required"
            exit 1
          fi
          case "$BACKEND_ORIGIN" in
            https://*) ;;
            *)
              echo "BACKEND_ORIGIN must be an HTTPS origin"
              exit 1
              ;;
          esac
          HEALTH_URL="${BACKEND_ORIGIN%/}/health"
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --connect-timeout 15 \
            --max-time 90 \
            --retry 1 \
            --retry-delay 5 \
            --retry-connrefused \
            --request GET \
            --header 'Accept: application/json' \
            "$HEALTH_URL")"
          if [ "$RESPONSE" != '{"status":"available"}' ]; then
            echo "Unexpected health response"
            exit 1
          fi

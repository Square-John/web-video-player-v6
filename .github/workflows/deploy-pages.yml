name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'Square-John/web-video-player-v6'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix client ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build frontend
        run: npm run build:frontend

      - name: Prepare GitHub Pages artifact
        env:
          BACKEND_ORIGIN: ${{ vars.BACKEND_ORIGIN }}
        run: |
          if [ -z "$BACKEND_ORIGIN" ]; then
            echo "Repository Variable BACKEND_ORIGIN is required"
            exit 1
          fi
          case "$BACKEND_ORIGIN" in
            https://*) ;;
            *)
              echo "BACKEND_ORIGIN must be an HTTPS origin"
              exit 1
              ;;
          esac
          npm --prefix client run prepare:github-pages -- --backend-origin "$BACKEND_ORIGIN"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

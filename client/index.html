<!doctype html>
<html lang="zh-CN">
  <head>
    <!-- 告诉浏览器当前页面使用 UTF-8 编码，保证中文内容正常显示。 -->
    <meta charset="UTF-8" />

    <!-- 让页面宽度跟随设备宽度，保证页面在桌面端和移动端都按设备宽度渲染。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 浏览器标签页标题，用来标识当前应用。 -->
    <title>Web Video Player v6</title>
  </head>
  <body>
    <!-- Vue 应用最终会挂载到这个节点上，main.js 里的 .$mount('#app') 对应这里。 -->
    <div id="app"></div>

    <!-- Vite 的前端入口脚本，浏览器会从这里开始加载 Vue 应用。 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
